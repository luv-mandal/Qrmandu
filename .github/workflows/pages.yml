name: Deploy QRmandu to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build static export for GitHub Pages
        run: |
          # Backup dynamic routes that require server
          mkdir -p /tmp/backup
          mv app/dashboard /tmp/backup/ 2>/dev/null || true
          mv app/admin /tmp/backup/ 2>/dev/null || true
          mv app/api /tmp/backup/ 2>/dev/null || true
          mv app/review /tmp/backup/ 2>/dev/null || true
          mv app/r /tmp/backup/ 2>/dev/null || true
          mv app/onboarding /tmp/backup/ 2>/dev/null || true
          # Create export config
          cat > next.config.js <<'JS'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            trailingSlash: true,
          }
          module.exports = nextConfig
          JS
          npm run build
          # Restore for artifact completeness (not needed)
          mv /tmp/backup/dashboard app/ 2>/dev/null || true
          mv /tmp/backup/admin app/ 2>/dev/null || true
          mv /tmp/backup/api app/ 2>/dev/null || true
          mv /tmp/backup/review app/ 2>/dev/null || true
          mv /tmp/backup/r app/ 2>/dev/null || true
          mv /tmp/backup/onboarding app/ 2>/dev/null || true
          # Restore original next.config.js
          cat > next.config.js <<'JS'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            experimental: { serverComponentsExternalPackages: [] },
            images: { remotePatterns: [] },
            async headers() {
              return [
                {
                  source: '/(.*)',
                  headers: [
                    { key: 'X-Frame-Options', value: 'SAMEORIGIN' },
                    { key: 'X-Content-Type-Options', value: 'nosniff' },
                    { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
                    { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=()' },
                  ]
                }
              ]
            }
          }
          module.exports = nextConfig
          JS
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
